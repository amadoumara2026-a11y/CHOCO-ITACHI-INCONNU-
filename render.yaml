services:
    - type: web
    name: choco-itachi-md
    runtime: docker
    dockerfilePath: lib/Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
            - key: SESSION_ID
        value: ""
            - key: OWNER_NUMBER
        value: "224629447488"
            - key: BOT_NAME
        value: "CHOCO-ITACHI-INCONNU"
            - key: PACKNAME
        value: "CHOCO-ITACHI"
            - key: COMMAND_MODE
        value: "public"
            - key: TIMEZONE
        value: "Africa/Conakry"
            - key: BOT_OWNER
        value: "Boss Alin - Choco Itachi"
            - key: PREFIXES
        value: "."
            - key: MONGO_URL
        value: ""
            - key: POSTGRES_URL
        value: ""
            - key: MYSQL_URL
        value: ""
            - key: DB_URL
        value: ""
            - key: PORT
        value: "5000"
            - key: NODE_ENV
        value: "production"
    startCommand: npm run start:optimized